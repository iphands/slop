# Client-side NFS readahead, in KB. Read by /usr/libexec/nfsrahead, which the stock
# nfs-utils udev rule (/usr/lib/udev/rules.d/99-nfs.rules) runs for every new bdi.
# Without this section nfsrahead answers 128 for everything.
#
# install: cp config/nfs.conf /etc/nfs.conf   (no /etc/nfs.conf exists on this box today;
#          if one appears later, just merge this section into it)
# applies on next mount of each share; existing mounts keep their current value.
[nfsrahead]
nfs=32768
nfs4=32768
default=128
