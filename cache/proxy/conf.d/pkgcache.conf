# Reverse caching proxy for OS package repositories.
#
# Clients point their repo config at this server; each path prefix maps to a
# real upstream mirror. nginx originates the upstream connection itself (HTTP
# for Debian, HTTPS for Fedora), so it can cache Fedora content that dnf would
# otherwise fetch over TLS+metalink and that a forward proxy could never see.
#
# Caching strategy (correctness-critical):
#   * metadata (Release/InRelease/Packages/repomd.xml/*.xml/by-hash) -> 60s,
#     revalidated cheaply with If-Modified-Since. Serving stale indices causes
#     apt/dnf hash-mismatch errors, so this MUST stay short.
#   * package files (*.deb/*.udeb/*.rpm) -> 365d, they are immutable. This needs
#     proxy_ignore_headers in each package sub-location: upstream Cache-Control
#     outranks proxy_cache_valid, and Fastly's max-age=2592000 would otherwise
#     silently cap Debian packages at 30 days.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # REQUIRED by the dated stats access_log in nginx.conf, and for no other
    # reason. When an access_log path contains a variable, nginx tests the
    # existence of this server's root before every write and SILENTLY SKIPS
    # LOGGING if it is missing -- the only symptom is
    #   [error] testing "/etc/nginx/html" existence failed ... while logging request
    # in the error log, while nginx -t passes and caching works perfectly.
    # The base image has no /etc/nginx/html and nothing here serves files from
    # disk (every location proxies or returns), so without this the stats log is
    # never created. /tmp exists in the image and is uid-agnostic. Verified
    # 2026-07-18; see context/pitfalls.md.
    root /tmp;

    # Expose cache result on every response for easy verification:
    #   curl -sI http://cache:8080/debian/... | grep X-Cache-Status
    add_header X-Cache-Status $upstream_cache_status always;

    # Sane upstream connection defaults (keepalive-friendly, patient on big rpms).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Resilience: keep serving the cached copy while revalidating or if the
    # upstream is briefly unreachable.
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_lock on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = / {
        return 200 "package caching proxy: /debian/  /debian-security/  /ubuntu/  /ubuntu-security/  /fedora/\n";
    }

    # ---- Debian main ------------------------------------------------------
    location /debian/ {
        proxy_pass http://deb.debian.org/debian/;
        proxy_cache pkg;
        proxy_cache_valid 200 302 60s;      # metadata
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;

        location ~* \.(deb|udeb)$ {
            proxy_pass http://deb.debian.org;   # regex loc: full /debian/... URI passes through
            proxy_cache pkg;
            proxy_cache_valid 200 365d;         # immutable package
            # Fastly sends `Cache-Control: public, max-age=2592000`, and upstream
            # Cache-Control OUTRANKS proxy_cache_valid -- so without this line the
            # "365d" above is silently only 30 days. Measured 2026-07-18 by reading
            # valid_sec out of the nginx cache file header. Package files are
            # immutable (a new version is a new filename), so overriding upstream
            # here is safe. In a METADATA location, ignoring Cache-Control is only
            # ever allowed to make the TTL SHORTER, never longer -- see the /ubuntu/
            # blocks, where upstream s-maxage=3300 must be clamped down to 60s.
            proxy_ignore_headers Cache-Control Expires;
        }
    }

    # ---- Debian security --------------------------------------------------
    location /debian-security/ {
        proxy_pass http://security.debian.org/debian-security/;
        proxy_cache pkg;
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;

        location ~* \.(deb|udeb)$ {
            proxy_pass http://security.debian.org;
            proxy_cache pkg;
            proxy_cache_valid 200 365d;
            # Fastly sends `Cache-Control: public, max-age=2592000`, and upstream
            # Cache-Control OUTRANKS proxy_cache_valid -- so without this line the
            # "365d" above is silently only 30 days. Measured 2026-07-18 by reading
            # valid_sec out of the nginx cache file header. Package files are
            # immutable (a new version is a new filename), so overriding upstream
            # here is safe. In a METADATA location, ignoring Cache-Control is only
            # ever allowed to make the TTL SHORTER, never longer -- see the /ubuntu/
            # blocks, where upstream s-maxage=3300 must be clamped down to 60s.
            proxy_ignore_headers Cache-Control Expires;
        }
    }

    # ---- Ubuntu main (jammy + -updates + -backports) ----------------------
    # Client path and upstream path are identical (/ubuntu/...), so the .deb
    # sub-location needs no rewrite -- same situation as /debian/.
    location /ubuntu/ {
        proxy_pass http://archive.ubuntu.com/ubuntu/;
        proxy_cache pkg;
        # THE ONE UBUNTU-SPECIFIC LINE, and it is correctness-critical. Both Ubuntu
        # upstreams send `Cache-Control: max-age=0, proxy-revalidate, s-maxage=3300`.
        # nginx checks s-maxage BEFORE max-age and upstream Cache-Control outranks
        # proxy_cache_valid, so without this the 60s below is really 55 MINUTES --
        # a 55-minute window for InRelease and Packages.gz to disagree, i.e. the
        # apt "hash sum mismatch" this project's TTL split exists to prevent.
        # Ignoring it here CLAMPS DOWN (3300s -> 60s); never use it to lengthen a
        # metadata TTL. proxy-revalidate is not implemented by nginx, so it does
        # not save us. Measured 2026-07-25; see context/pitfalls.md.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 302 60s;      # metadata
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;          # 60s refresh is a cheap If-Modified-Since

        location ~* \.(deb|udeb)$ {
            proxy_pass http://archive.ubuntu.com;   # regex loc: /ubuntu/... passes through
            proxy_cache pkg;
            proxy_cache_valid 200 365d;             # immutable package
            # Same s-maxage=3300 would cap packages at 55 minutes. Packages are
            # immutable, so pin the year.
            proxy_ignore_headers Cache-Control Expires;
        }
    }

    # ---- Ubuntu security (jammy-security) ---------------------------------
    # Client /ubuntu-security/... maps to upstream /ubuntu/... on a DIFFERENT host,
    # so unlike /debian-security/ this block does remap the path -- which means the
    # regex sub-location below must re-apply it by hand (Critical Fact #2).
    location /ubuntu-security/ {
        proxy_pass http://security.ubuntu.com/ubuntu/;
        proxy_cache pkg;
        proxy_ignore_headers Cache-Control Expires;   # clamp s-maxage=3300 -> 60s, see above
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;

        location ~* \.(deb|udeb)$ {
            # A regex location may not carry a URI on proxy_pass, so the parent's
            # /ubuntu-security/ -> /ubuntu/ remap is LOST here and re-applied by hand.
            # Drop this rewrite and every .deb 404s while metadata keeps working.
            rewrite ^/ubuntu-security/(.*)$ /ubuntu/$1 break;
            proxy_pass http://security.ubuntu.com;
            proxy_cache pkg;
            proxy_cache_valid 200 365d;
            proxy_ignore_headers Cache-Control Expires;
        }
    }

    # ---- Fedora (releases + updates) --------------------------------------
    # /fedora/... on the client maps to /pub/fedora/... on the master mirror.
    # dl.fedoraproject.org is HTTPS; nginx terminates+originates the TLS.
    location /fedora/ {
        proxy_pass https://dl.fedoraproject.org/pub/fedora/;
        proxy_ssl_server_name on;
        proxy_cache pkg;
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;

        location ~* \.rpm$ {
            # regex loc drops the proxy_pass URI, so re-apply the path remap.
            rewrite ^/fedora/(.*)$ /pub/fedora/$1 break;
            proxy_pass https://dl.fedoraproject.org;
            proxy_ssl_server_name on;
            proxy_cache pkg;
            proxy_cache_valid 200 365d;
            # dl.fedoraproject.org sends no Cache-Control today, so the 365d above
            # already applies -- but pin it, so a mirror change (SERIES Plan 07)
            # cannot silently shorten package retention. Measured 2026-07-18.
            proxy_ignore_headers Cache-Control Expires;
        }
    }
}
