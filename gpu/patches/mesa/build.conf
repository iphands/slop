# Build configuration for the local Mesa rebuild. Sourced by scripts/vendor-build.sh.
#
# This is authored, not generated, so it lives in git next to the patches. Only the
# variables below are read; it is sourced as shell, so keep it to assignments.

# --- compiler flags ---------------------------------------------------------------------
# Replaces Fedora's %optflags wholesale, which propagates to %build_cflags,
# %build_cxxflags and %build_fflags (verified: `rpm --define 'optflags ...' --eval
# '%{build_cxxflags}'`). The spec separately forces LTO off for Mesa — a Fedora bug where
# LTO broke some games, rhbz#1862771 — so nothing here needs to fight that.
#
# TWO FLAGS TO BE AWARE OF, because they trade away things this project uses:
#
#   -fomit-frame-pointer  Fedora ships -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer
#                         specifically so perf can unwind. Omitting frame pointers degrades
#                         CPU call stacks in perf and Perfetto — which is Plan 05's whole
#                         mechanism for answering *why* a pass is slow.
#   (no -g)               Fedora's default carries -g. Without it there is no debuginfo, so
#                         profiles show addresses instead of Mesa function names.
#
# Adding "-g -fno-omit-frame-pointer" back costs a little size and essentially no speed.
# Left as requested; change here if a profile comes back unsymbolised.
#
# Also dropped relative to Fedora's default: -fstack-protector-strong, _FORTIFY_SOURCE=3,
# -fcf-protection, -fstack-clash-protection, -fexceptions, annobin. Acceptable for a local
# performance build; do not ship these RPMs anywhere.
#
# -march=native makes the result non-portable — it is tuned for this box's CPU only. That
# is fine because the baseline (`--no-patches`) is built through the same path with the
# same flags, so a patched-vs-baseline comparison stays one-variable. A comparison against
# the *distro* RPM would not be.
BUILD_OPTFLAGS="-march=native -O3 -pipe -falign-functions=32 -fvisibility=default -fomit-frame-pointer"

# --- driver trimming --------------------------------------------------------------------
# The A310 is DG2/gfx12.5: ANV for Vulkan, iris for GL. Everything below is switched off.
#
# The constraint that decides what is removable is NOT the meson option list — it is the
# spec's %files. Several drivers are listed there unconditionally, so dropping them from
# the build turns packaging into a "File not found" failure. Those are handled by explicit
# %files edits (MESA_FILES_DROP); the rest are already guarded by %if 0%{?with_X} and only
# need the global flipped.
#
# KEPT deliberately:
#   iris, intel (ANV), intel_hasvk, crocus, i915 — Intel, including the legacy gens. Small,
#     and %files wires hasvk/crocus/i915 in unconditionally.
#   llvmpipe, softpipe, swrast/lvp — the software fallback. %files lists swrast_dri.so and
#     libvulkan_lvp.so unconditionally, and removing the CPU fallback can break anything
#     that enumerates it (DXVK does).
#   virgl/virtio_gpu — likewise unconditional in %files.
MESA_DISABLE_GLOBALS="with_radeonsi with_r600 with_r300 with_vmware with_freedreno
                      with_etnaviv with_tegra with_vc4 with_v3d with_lima with_panfrost
                      with_kmsro with_nvk with_opencl"

# Removed from the hardcoded part of -Dgallium-drivers (the rest is macro-driven and
# follows MESA_DISABLE_GLOBALS automatically).
MESA_GALLIUM_DROP="nouveau zink"

# AMD's RADV comes in via `%global base_vulkan ,amd`; blank it.
MESA_BLANK_GLOBALS="base_vulkan"

# %files lines to delete, because the drivers above are listed there unconditionally.
# Each must match exactly one line or the build stops — a spec that has moved on is a
# reason to re-read it, not to package something we did not build.
MESA_FILES_DROP="%{_libdir}/dri/nouveau_dri.so
                 %{_libdir}/dri/nouveau_drv_video.so
                 %{_libdir}/dri/zink_dri.so
                 %{_libdir}/libvulkan_radeon.so
                 %{_datadir}/vulkan/icd.d/radeon_icd.*.json"

# --- packaging --------------------------------------------------------------------------
# Our rebuild otherwise produces a NEVRA byte-identical to the installed COPR package, so
# `dnf install` reports "already installed" and does nothing. A dist suffix makes the local
# build a distinguishable upgrade, so `rpm -q` tells you at a glance which one is loaded,
# and `dnf distro-sync 'mesa*'` cleanly puts the COPR build back.
BUILD_DIST_SUFFIX=".gpu"

# BUILD_OPTFLAGS carries no -g, so the -debuginfo/-debugsource subpackages would be built
# from nothing and rpmbuild fails on the empty %files. If you add -g back (recommended --
# see the note above), drop this line so you get symbolised profiles packaged properly.
BUILD_RPM_DEFINES="debug_package %{nil}"
