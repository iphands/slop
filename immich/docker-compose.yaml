name: immich-ml

services:
  immich-machine-learning:
    container_name: immich_machine_learning
    # Keep this tag in sync with the Immich version running on your NAS
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    ports:
      - "192.168.2.2:3003:3003"
    volumes:
      - model-cache:/cache
      # Patched ORT session: GPU arena shrinkage + cuDNN options (VRAM ratchet -> OOM fix).
      # Pinned to this image's ort.py; re-diff against ml-patch/ort.py.orig when IMMICH_VERSION changes.
      - ./ml-patch/ort.py:/usr/src/immich_ml/sessions/ort.py:ro
    environment:
      # Unload idle models from VRAM sooner (seconds); default is 300
      MACHINE_LEARNING_MODEL_TTL: 240
      ORT_ARENA_SHRINK: "1"
      ORT_CUDA_CONV_ALGO: HEURISTIC
      ORT_CUDA_CONV_MAX_WS: "0"
      # ORT_CUDA_MEM_LIMIT_GB: "24"   # per-model cap; enable if VRAM still creeps
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      disable: false

  # Remote NVENC ffmpeg for immich_server on noir (client: ffmpeg-over-ip/noir-override.yaml).
  # File I/O is tunneled back to the client, so no shared FS / path mapping. Run ffmpeg-over-ip/fetch.sh first.
  ffmpeg-over-ip:
    container_name: ffmpeg_over_ip
    image: debian:trixie-slim
    # Server runs the patched jellyfin-ffmpeg next to its own binary, not anything on PATH
    command: ["/opt/ffoip/ffmpeg-over-ip-server"]
    ports:
      - "192.168.2.2:5050:5050"
    volumes:
      - ./ffmpeg-over-ip/bin/server:/opt/ffoip:ro
    environment:
      FFMPEG_OVER_IP_SERVER_ADDRESS: 0.0.0.0:5050
      FFMPEG_OVER_IP_SERVER_AUTH_SECRET: ${FFOIP_SECRET:?set FFOIP_SECRET in .env}
      FFMPEG_OVER_IP_SERVER_LOG: stdout
      # Per-file sequential readahead over the tunnel (default 2 MiB, max 16 MiB)
      FFOIP_READAHEAD_BYTES: "16777216"
      # Default is compute,utility; NVENC/NVDEC need the video libs (libnvidia-encode, nvcuvid)
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${FFOIP_GPU:-0}"]
              capabilities: [gpu, compute, video, utility]
    restart: unless-stopped

volumes:
  model-cache:
